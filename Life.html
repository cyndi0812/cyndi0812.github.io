<!-- ===== 生活模式（My Days）：由 Index.html 用 include('Life') 載入 ===== -->
<style>
/* ===== 流畅度：长清单画面外的卡片先不排版 ===== */
.card.reply{content-visibility:auto;contain-intrinsic-size:auto 150px}
:root{--c-car:#bfeee6;--c-other:#ece6df;--c-sport:#d2f2c4;--c-meet:#ffdcbc;--c-trip:#fff0b3;--c-bill:#d9e2ee;--c-anniv:#ffc9c2;--c-school:#c9d6ff;--c-med:#c8ecfb;--c-beauty:#f8cdef;--c-pet:#ecd8c2;--c-shop:#ebf5bf;--c-date:#ffd6e4;--c-alice:#e3d9ff;--chip-ink:#3e2c22}
/* 工作 ⇄ 生活 切換鈕 */
.modesw{display:flex;gap:4px;margin:12px 14px 0;padding:4px;border-radius:999px;background:var(--soft);border:1.5px solid var(--line)}
.modesw button{flex:1;border:0;background:none;border-radius:999px;padding:7px 6px;font:inherit;font-size:13px;font-weight:700;color:var(--mute);cursor:pointer;transition:transform .15s}
.modesw button:hover{transform:translateY(-1px)}
.modesw button.on{background:var(--acc);color:var(--acc-ink);box-shadow:0 3px 0 color-mix(in srgb,var(--acc) 55%,#000)}
body.mini .modesw{display:none}
@media (max-width:760px){.modesw{margin:8px 10px}}
/* 生活月曆 */
.lcal{padding:16px 18px 18px}
.lcal-hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.lcal-hd b{font-size:17px;flex:1}
.lgst{font-size:11.5px;border-radius:999px;padding:2px 10px;border:1.5px solid var(--line);background:var(--panel);color:var(--mute)}
.lgst.ok{border-color:#9cc27a;color:var(--ink)}.lgst.err{border-color:var(--red);color:var(--red)}
.lwk,.ldays{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.lwk div{text-align:center;font-size:12px;color:var(--mute);font-weight:700;padding-bottom:4px}
.lwk div:nth-child(n+6){color:var(--red)}
.ld{position:relative;min-height:86px;border:1.5px solid var(--line);border-radius:14px;background:var(--panel);padding:6px;display:flex;flex-direction:column;gap:3px;text-align:left;cursor:pointer;font:inherit;color:var(--ink);min-width:0;transition:transform .15s,border-color .15s}
.ld:hover{border-color:var(--acc);transform:translateY(-2px)}
.ld.blank{background:transparent;border-color:transparent;cursor:default;transform:none}
.ld.we{background:var(--soft2)}
.ld.now{border:2px solid var(--acc);margin-top:5px}
.ld.now::before,.ld.now::after{content:"";position:absolute;top:-11px;width:14px;height:11px;background:var(--acc);clip-path:polygon(50% 0,100% 100%,0 100%)}
.ld.now::before{left:10px;transform:rotate(-14deg)}.ld.now::after{right:10px;transform:rotate(14deg)}
.ld.sel{box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 35%,transparent)}
.ld .n{font-weight:700;font-size:12px;display:flex;align-items:center;gap:4px}
.btn.icob{width:40px;height:40px;padding:0;justify-content:center;font-size:18px;border-radius:50%}
.lrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;margin-top:20px;align-items:stretch}
.lrow>.box{margin:0!important}
.lrow>.fold .fb{max-height:none}
@media (max-width:900px){.lrow{grid-template-columns:1fr}}
.wform{display:flex;gap:8px;flex-wrap:wrap;padding:12px 14px}.wform select{width:auto}.wform [name=name]{flex:2;min-width:180px}.wform [name=place]{flex:1;min-width:120px}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.wcard{padding:12px 14px;display:flex;flex-direction:column;gap:4px;border-top:6px solid var(--wc)!important}
.wcard .wt{align-self:flex-start;font-size:11.5px;font-weight:700;padding:1px 9px;border-radius:999px;background:var(--wc);color:#3e2c22}
.wcard b{font-size:15px}.wcard small{color:var(--mute);font-size:12px}
.wact{display:flex;align-items:center;gap:10px;margin-top:6px}
.nbook{display:grid;grid-template-columns:280px minmax(0,1fr);gap:16px;align-items:stretch}
.nside{padding:12px;display:flex;flex-direction:column;gap:10px;max-height:75vh}
.nlist2{display:flex;flex-direction:column;gap:6px;overflow:auto}
.nli{display:flex;flex-direction:column;gap:2px;text-align:left;padding:8px 10px;border-radius:12px;border:1.5px solid var(--line);background:var(--panel);cursor:pointer;font:inherit;color:var(--ink)}
.nli:hover{border-color:var(--acc)}.nli.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,var(--panel))}
.nli b{font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.nli small{font-size:11.5px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nedit{padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-height:60vh}
.nbar{display:flex;gap:6px;align-items:center}.nbar .ntitle{flex:1;font-size:16px;font-weight:700}
.ntext{flex:1;min-height:55vh;resize:vertical;font:inherit;font-size:15px!important;line-height:30px!important;padding:8px 16px 0!important;
  background-image:linear-gradient(to bottom,transparent 29px,color-mix(in srgb,var(--line) 85%,transparent) 29px,color-mix(in srgb,var(--line) 85%,transparent) 30px)!important;background-size:100% 30px!important;background-position:0 1px!important;background-attachment:local!important;background-repeat:repeat!important}
@media (max-width:760px){.nbook{grid-template-columns:1fr}.nside{max-height:none}}
.lcolL{display:flex;flex-direction:column;gap:20px;min-width:0}
.lcolL>.box,.lcolL>.fold{margin:0!important}
.lcnt{font-size:11px;font-weight:700;border-radius:999px;padding:0 8px;background:var(--soft);color:var(--mute)}
.lng{border-radius:14px;padding:4px 12px}
.ntoday{background:linear-gradient(120deg,#fff3e0,#ffeef4);border:1.5px solid #ffd3b0}
.nfut{background:var(--panel)}
.nfut .ni{opacity:.9}
.ld .lmlb{font-size:13px;line-height:1;filter:drop-shadow(0 1px 1px rgba(0,0,0,.12))}
.ld.we .n{color:var(--red)}
.ld .paw{position:absolute;right:6px;bottom:3px;font-size:11px;opacity:.55}
.lchip{font-size:11.5px;font-weight:700;border-radius:999px;padding:1px 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--chip-ink);max-width:100%}
.lmore{font-size:11px;color:var(--mute)}
.lleg{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:6px;margin-top:14px;font-size:12px;color:var(--mute)}
.lleg span{display:flex;align-items:center;gap:3px;white-space:nowrap;overflow:hidden;border:1.5px solid var(--line);border-radius:999px;padding:3px 10px;background:var(--panel)}
.lleg i{display:inline-block;flex:none;width:9px;height:9px;border-radius:50%;margin-right:4px}
/* 行程卡 */
.lev{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line);border-radius:16px;padding:9px 12px;background:var(--panel);margin-bottom:8px;cursor:pointer;width:100%;box-sizing:border-box;text-align:left;font:inherit;color:var(--ink);text-decoration:none;transition:transform .15s,border-color .15s}
.lev:hover{border-color:var(--acc);transform:translateY(-2px)}
.lev .em{font-size:18px;line-height:1.3}
.lev .t{font-size:12px;color:var(--mute);min-width:40px;padding-top:2px}
.lev .bd{flex:1;min-width:0}
.lev b{display:block;overflow-wrap:anywhere}
.lev small{display:block;color:var(--mute);overflow-wrap:anywhere}
.lev .pl{color:var(--acc)}
.gb{font-size:10.5px;font-weight:700;background:var(--c-school);color:var(--chip-ink);border-radius:999px;padding:0 7px;margin-left:4px;vertical-align:1px}
.lpre{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px}
.lpre .lbl{font-size:12px;color:var(--acc);font-weight:700}
.lpre .chip i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.lcats{display:flex;flex-wrap:wrap;gap:6px}
.lcats .chip{color:var(--chip-ink);border:2px solid transparent;font-weight:700}
.lcats .chip.on{border-color:var(--ink);background:inherit}
.lgreet{cursor:pointer}
.lempty{border:2px dashed var(--line);border-radius:16px;padding:18px;text-align:center;color:var(--mute);font-size:13px}
/* 定期預約 */
.lrt{display:flex;gap:10px;align-items:center;border:1.5px solid var(--line);border-radius:18px;padding:10px 12px;background:var(--panel);margin-bottom:8px}
.lrt.over{border-color:var(--red);background:color-mix(in srgb,var(--red) 8%,var(--panel))}
.lrt.soon{border-color:#e0a100}.lrt.booked{border-color:#9cc27a}
.lrt .ic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:18px;flex:none}
.lrt .tx{flex:1;min-width:0}
.lrt .tx small{display:block;color:var(--mute);font-size:12px}
.lrt .st{font-size:13px;font-weight:700}
.lrt.over .st{color:var(--red)}
.lrt .ac{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.btn.sm{padding:4px 12px;font-size:12px}
/* 待辦 */
.ltd{display:flex;align-items:center;gap:10px;padding:8px 2px;border-bottom:1.5px dashed var(--line)}
.ltd:last-child{border-bottom:0}
.ltd input{width:17px;height:17px;accent-color:var(--acc);flex:none}
.ltd span{flex:1;min-width:0;overflow-wrap:anywhere}
.ltd.done span{text-decoration:line-through;opacity:.5}
.ltd .x{border:0;background:none;color:var(--mute);cursor:pointer;font-size:16px}
.ltdadd{display:flex;gap:8px;margin-top:10px}
.ltdadd .in{flex:1;min-width:0}
/* 撒花 */
.lburst{position:fixed;pointer-events:none;z-index:99;font-size:18px;left:0;top:0;animation:lfly .9s ease-out forwards}
@keyframes lfly{to{transform:translate(var(--bx),var(--by)) rotate(var(--br)) scale(.6);opacity:0}}
@media (max-width:560px){.ld{min-height:58px;padding:4px}.lchip{font-size:0;height:6px;padding:0}.lwk,.ldays{gap:4px}}
@media (prefers-reduced-motion:reduce){.lburst{display:none}.ld,.lev,.modesw button{transition:none}}

.lskins .skin small{color:var(--mute);font-size:11px}

/* ===== 工作模式：班別顏色（馬卡龍淺色，深淺色模式都清楚） ===== */
.shift.shc{background:var(--shbg)!important;color:var(--shfg)!important;font-weight:800;font-size:12.5px;padding:2px 9px;letter-spacing:.02em;box-shadow:0 2px 0 var(--shdk)}
.shift.shc.shift-big{font-size:16px;padding:4px 14px}
.chip.shc{border:2px solid var(--shdk)!important;color:var(--ink)!important;font-weight:700}
.chip.shc::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--shbg);box-shadow:inset 0 0 0 1.5px var(--shdk);margin-right:6px;vertical-align:-1px}
.chip.shc.on{background:var(--shbg)!important;color:var(--shfg)!important;box-shadow:0 3px 0 var(--shdk)}
.chip.shc.on::before{background:var(--shfg);box-shadow:none}
.day .shift.shc{font-size:11px;padding:0 7px;line-height:18px;letter-spacing:0;box-shadow:0 1.5px 0 var(--shdk)}
@media (max-width:760px){.day .shift.shc{font-size:10px;padding:0 5px;line-height:16px}}
/* 休：圓形小徽章（只顯示文字），大一點、活潑、醒目 */
.day .rest{position:absolute;right:6px!important;top:6px!important;width:28px;height:28px;padding:0!important;border-radius:50%!important;
  display:grid;place-items:center;font-size:14px!important;font-weight:900;line-height:1!important;letter-spacing:0;
  /* 白底＋彩虹圈：和任何班別顏色都不撞 */
  background:linear-gradient(#fffdf8,#fffdf8) padding-box,conic-gradient(from 0deg,#ff9ec4,#ffd36e,#9fe3b8,#8fcbff,#c7a8ff,#ff9ec4) border-box!important;
  color:#e0567f!important;border:3px solid transparent!important;box-shadow:0 3px 0 rgba(0,0,0,.25),0 0 10px rgba(255,214,110,.35)!important;transform:rotate(-8deg)}
.day .rest.rlv{color:#4a5d75!important;background:linear-gradient(#f5f8fc,#f5f8fc) padding-box,conic-gradient(from 0deg,#b9c8dc,#dde6f0,#c7b8e8,#b9c8dc) border-box!important}
.day .rest.ryr{color:#d23a2c!important;background:linear-gradient(#fff6dc,#fff6dc) padding-box,conic-gradient(from 0deg,#e8473c,#ffcf4a,#e8473c,#ffcf4a,#e8473c) border-box!important;box-shadow:0 3px 0 rgba(0,0,0,.25),0 0 10px rgba(255,190,60,.55)!important}
.day .rest.ryr::after{content:"\1F9E7 ";background:none;box-shadow:none;width:auto;height:auto;font-size:11px;right:-9px;top:-9px}
.day .rest.rtx{color:#2b6e66!important;background:linear-gradient(#f0fffb,#f0fffb) padding-box,conic-gradient(from 0deg,#9fe3d0,#c9f2ec,#8fcbff,#9fe3d0) border-box!important}
.day .rest::after{content:"";position:absolute;right:-3px;top:-3px;width:7px;height:7px;border-radius:50%;background:#fff3a6;box-shadow:0 0 0 1.5px #fff}
@media (max-width:760px){.day .rest{width:22px;height:22px;font-size:11.5px!important;right:3px!important;top:3px!important}}
@media (prefers-reduced-motion:no-preference){
  .day .rest{animation:restbob 2.6s ease-in-out infinite}
  .day.off:hover .rest{animation:resthop .55s ease}
  @keyframes restbob{0%,100%{transform:rotate(-8deg) translateY(0)}50%{transform:rotate(6deg) translateY(-2px)}}
  @keyframes resthop{0%{transform:rotate(-8deg) scale(1)}40%{transform:rotate(10deg) scale(1.22) translateY(-4px)}100%{transform:rotate(-8deg) scale(1)}}
}


/* ===== 每月節慶氣氛（工作／生活月曆共用） ===== */
.festbar{position:relative;display:flex;align-items:center;gap:10px;padding:9px 18px;margin:0 0 12px;border-radius:16px;font-weight:800;font-size:13.5px;color:var(--ink);
  background:linear-gradient(100deg,color-mix(in srgb,var(--fest) 30%,transparent),color-mix(in srgb,var(--fest) 8%,transparent) 70%,transparent);
  border:1.5px dashed color-mix(in srgb,var(--fest) 60%,transparent);overflow:hidden}
.festbar .ft{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.festbar .ft small{font-weight:600;color:var(--mute);margin-left:6px}
.festbar .fe{font-size:20px;line-height:1;display:inline-block}
.festbar .fx{display:flex;gap:6px;flex:none}
.festbar::after{content:"";position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(color-mix(in srgb,var(--fest) 45%,transparent) 1.4px,transparent 1.6px);background-size:16px 16px;opacity:.35}
.calbody .festbar{margin-top:-4px}
.hol{display:block;margin-top:3px;font-size:10.5px;font-weight:800;line-height:1.3;border-radius:999px;padding:1px 6px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  background:color-mix(in srgb,var(--fest) 26%,transparent);color:var(--ink);align-self:flex-start}
.day.isHol,.ld.isHol{box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--fest) 70%,transparent)}
.day.isHol.now,.ld.isHol.now{box-shadow:none}
@media (max-width:560px){.hol .hn{display:none}.festbar .ft small{display:none}}
@media (prefers-reduced-motion:no-preference){
  .festbar .fe{animation:festbob 2.8s ease-in-out infinite}
  .festbar .fe:nth-child(2){animation-delay:.4s}.festbar .fe:nth-child(3){animation-delay:.8s}
  @keyframes festbob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-4px) rotate(8deg)}}
}

/* ===== 便签：输入框和便签卡都跟着内容自动长高（完整显示） ===== */
#mNew,#stkNew{resize:none;overflow:hidden;min-height:58px;max-height:none;line-height:1.6}
.stkta{overflow:hidden!important;max-height:none!important}

/* 便签清除键／移出常用 */
.btn.clr{background:transparent;border:1.5px dashed var(--line);color:var(--mute)}
.btn.clr:hover{border-color:var(--acc);color:var(--acc)}
.unhot{border:1.5px solid var(--line);background:var(--panel);color:var(--mute);border-radius:999px;font:inherit;font-size:11.5px;padding:1px 9px;cursor:pointer;margin-left:6px;white-space:nowrap}
.unhot:hover{border-color:#ef6b6b;color:#ef6b6b}
.mct2 .unhot{float:right;margin-top:1px}

/* 平台速查：今天负责的平台代码加醒目外框 */
.plbox .chip.tdc{border:2px solid var(--acc)!important;font-weight:800;box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 25%,transparent)}
.plbox .chip.tdc::after{content:"\1F43E ";font-size:10px;margin-left:3px}

/* ===== 生理期 ===== */
.ld.per{background:radial-gradient(circle at 3px 3px,rgba(255,255,255,.85) 1.6px,transparent 2.2px) 0 0/12px 12px,linear-gradient(180deg,#ffeef4,#ffd9e6)!important;border:1.5px solid #ffb3cb!important;box-shadow:inset 0 0 0 2px rgba(255,255,255,.6)}
.ld.ppred{background:radial-gradient(circle at 3px 3px,#ffd6e4 1.4px,transparent 2px) 0 0/12px 12px,#fff8fb!important;border:1.5px dashed #ffb3cb!important}
.ld.pfw{background:radial-gradient(circle at 3px 3px,#d6f2e3 1.4px,transparent 2px) 0 0/12px 12px,#f6fdf9!important;border-color:#cdeedd!important}
.ld.pov{background:radial-gradient(circle at 3px 3px,rgba(255,255,255,.9) 1.6px,transparent 2.2px) 0 0/12px 12px,linear-gradient(180deg,#e4f8ee,#cdf0de)!important;border:1.5px solid #9fdcc0!important}
.ld.per::before,.ld.ppred::before{content:"";position:absolute;left:8px;right:8px;bottom:0;height:4px;border-radius:4px 4px 0 0;background:linear-gradient(90deg,#ffb3cb,#ffd6a8,#ffb3cb)}
.ld.ppred::before{opacity:.45}
.ld .pmk{position:absolute;right:6px;top:5px;font-size:13px;line-height:1;animation:pbob 2.6s ease-in-out infinite}
@keyframes pbob{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-2px) rotate(6deg)}}
@media (prefers-reduced-motion:reduce){.ld .pmk{animation:none}}
.pcard{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:20px 22px;background:linear-gradient(120deg,#ffe3ec,#fff3f7 60%,#f3ecff)!important}
.pcard.on{background:linear-gradient(120deg,#ffd0de,#ffe6ee 60%,#fff3f7)!important}
.pring{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;font-size:30px;background:#fff;border:3px solid #ff9ec0;box-shadow:0 4px 0 #f5b5c9;flex:none}
.pbig{font-size:20px;font-weight:800;color:#b03a64}.pbig b{font-size:30px}
.psub{color:var(--mute);font-size:13px;margin-top:2px}
.pacts{display:flex;gap:8px;flex-wrap:wrap}
.pstats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pstats>div{border:1.5px dashed var(--line);border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;background:var(--panel)}
.pstats span{font-size:12px;color:var(--mute)}.pstats b{font-size:19px;color:#c4456f}.pstats small{font-size:11.5px;color:var(--mute)}
.plog{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:9px 2px;border-bottom:1.5px dashed var(--line)}
.plog:last-child{border-bottom:0}.plog .pd{font-weight:800;min-width:110px}.plog .muted{flex:1;min-width:0}

/* ===== 生活管理：保養本／記帳／購物／習慣／生日／小工具／天氣 ===== */
.lwx{display:inline-block;margin-top:6px;font-size:12.5px;font-weight:700;padding:3px 12px;border-radius:999px;background:var(--panel);border:1.5px solid var(--line);cursor:pointer}
.lwx:hover{border-color:var(--acc)}.lwx.err{color:#c8604a}
.cbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 16px;margin-bottom:16px}.cbar .in{width:140px}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.citem{display:flex;gap:12px;align-items:center;padding:12px 14px}
.citem.over{border-color:#e07a6a!important;background:color-mix(in srgb,#ffb3a7 18%,var(--panel))!important}
.citem.soon{border-color:#e8b75e!important;background:color-mix(in srgb,#ffe08a 20%,var(--panel))!important}
.cic{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:21px;background:var(--soft);flex:none}
.ctx{flex:1;min-width:0}.ctx b{display:block}.ctx small{display:block;color:var(--mute);font-size:12px;overflow-wrap:anywhere}
.cst{font-size:13px;font-weight:800;margin-top:2px}.citem.over .cst{color:#c8604a}.citem.soon .cst{color:#a8741a}
.cac{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
/* 多貓 */
.catbar{padding:12px 16px;margin-bottom:14px}
.cbhd{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.catchips{display:flex;flex-wrap:wrap;gap:6px}
.catchip{position:relative;border:1.5px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 11px;font:inherit;font-size:12.5px;cursor:pointer;color:var(--ink)}
.catchip:hover{border-color:var(--acc);transform:translateY(-1px)}
.catchip.over{border-color:#e07a6a;background:#fff0ed}.catchip.soon{border-color:#e8b75e;background:#fff8e6}
.catchip i{font-style:normal;font-weight:800;margin-left:4px;color:#c8604a}
.ctag{font-size:10.5px;font-weight:700;border-radius:999px;padding:1px 7px;background:#ece6df;color:#7a6a5a;vertical-align:2px;margin-left:4px}
.ctag.per{background:#e3d9ff;color:#5b3fa0}
.cbar2{height:6px;border-radius:6px;background:#f1e7dd;margin-top:6px;overflow:hidden}.cbar2 span{display:block;height:100%;background:linear-gradient(90deg,#bfeee6,#9fdcc0);border-radius:6px}
.cpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:6px;max-height:300px;overflow:auto;margin-bottom:6px}
.cpi input{display:none}
.cpi span{display:flex;flex-direction:column;align-items:center;padding:6px 4px;border:1.5px solid var(--line);border-radius:12px;font-size:12.5px;cursor:pointer;background:var(--panel)}
.cpi span small{font-size:10.5px;color:var(--mute)}
.cpi.over span{border-color:#f0a99d}.cpi.soon span{border-color:#f0cf8a}
.cpi input:checked+span{background:#e3d9ff;border-color:#a891e8;font-weight:700}
.cpi span{position:relative}.cpi input:checked+span::before{content:"✓";position:absolute;top:3px;left:8px;color:#5b3fa0;font-weight:800}
.cplist{display:flex;flex-direction:column;gap:6px;max-height:60vh;overflow:auto}
.cpr{display:grid;grid-template-columns:minmax(90px,1.2fr) 80px minmax(0,2fr) auto;gap:8px;align-items:center;padding:6px 10px;border-radius:12px;border:1.5px solid var(--line)}
.cpr.over{background:#fff0ed;border-color:#f0a99d}.cpr.soon{background:#fff8e6;border-color:#f0cf8a}
.cpr .cst{margin:0;font-size:12.5px}
.cvsec{display:flex;align-items:center;gap:8px;font-weight:800;font-size:13px;margin:14px 0 8px}
.cvsec:first-child{margin-top:0}
