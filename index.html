<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cyndi♡</title>
<!-- 手機桌面圖示 -->
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-512.png">
<meta name="apple-mobile-web-app-title" content="Cyndi♡">
<!-- 從桌面打開時全螢幕（沒有網址列、工具列） -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1a1240">
<style>
  html,body{margin:0;height:100%;background:#1a1240;overflow:hidden}
  #app{position:fixed;inset:0;width:100%;height:100%;border:0;padding-top:env(safe-area-inset-top);box-sizing:border-box;background:#1a1240}
  #tip{position:fixed;left:0;right:0;bottom:max(12px,env(safe-area-inset-bottom));text-align:center;font:13px -apple-system,sans-serif;color:#f3e9ff;opacity:0;transition:opacity .4s;pointer-events:none}
  #tip a{color:#ffb3d1;pointer-events:auto}
</style>
</head>
<body>
<iframe id="app" title="My Work" allow="clipboard-read; clipboard-write; notifications"></iframe>
<div id="tip">打不開嗎？<a id="go" href="#">點這裡直接打開工作台</a></div>
<script>
  var APP_URL = 'https://script.google.com/macros/s/AKfycbxZYCkFNUJsSm7q0W7qHi5MN8m9WFvPB0NTnzFWeM7dZwjWGcpR6RCV26Z2ERYJaQk5/exec';
  try {
    document.getElementById('go').href = APP_URL;
    document.getElementById('app').src = APP_URL;
    // 10 秒後還在載入／空白時，顯示「直接打開」的備用連結
    var loaded = false;
    document.getElementById('app').onload = function(){ loaded = true; };
    setTimeout(function(){ if(!loaded) document.getElementById('tip').style.opacity = 1; }, 10000);
  } catch (e) {
    document.body.innerHTML = '<p style="color:#fff;padding:20px">無法打開：' + e.message + '　<a style="color:#ffb3d1" href="' + APP_URL + '">直接打開工作台</a></p>';
  }
</script>
</body>
</html>
